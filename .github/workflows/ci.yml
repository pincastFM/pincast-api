# The package's checks on every push to main, every pull request and once a day: the tests on
# Node 20.12.0 (the oldest the package supports) and Node 22, the operations check, the changelog
# entry for package.json's version, and the package as it would publish. The daily run also compares
# the API file with NYID's, so a change there shows up here without a push.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 13 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.12.0', '22']
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version && npm --version
      # No dependencies, so nothing to install.
      - run: npm test
      - run: npm run check
      - run: node scripts/changelog.mjs --check
      - run: npm pack --dry-run

  # The package's API file must match NYID's (docs/api/placecard-v1.openapi.json on main).
  # NYID is private, so this job needs a repository secret NYID_READ_TOKEN: a fine-grained token
  # with read access to the contents of pincastFM/NYID and nothing else. With no secret (a fork,
  # or before it is set) the job says so and passes.
  api-file:
    runs-on: ubuntu-latest
    name: API file matches NYID
    env:
      HAS_NYID_TOKEN: ${{ secrets.NYID_READ_TOKEN != '' }}
    steps:
      - if: env.HAS_NYID_TOKEN != 'true'
        run: echo "::notice::No NYID_READ_TOKEN secret, so the API file was not compared with NYID's."
      - if: env.HAS_NYID_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          path: pincast-api
      # Checked out beside the package, where the sync script looks (../NYID).
      - if: env.HAS_NYID_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: pincastFM/NYID
          ref: main
          path: NYID
          token: ${{ secrets.NYID_READ_TOKEN }}
          persist-credentials: false
      - if: env.HAS_NYID_TOKEN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: env.HAS_NYID_TOKEN == 'true'
        working-directory: pincast-api
        run: NO_FETCH=1 node scripts/sync-openapi.mjs --check
